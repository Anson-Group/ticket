name: "Anson Group Ticket"
title: "[question]"
description: "Ticket Anson Group"
labels: "Ticket,Unsolved"
assignees: ansonquu
body:
- type: input
  id: "name"
  attributes:
    label: "昵称"
    description: "你希望我们对你的称呼"
  validations:
    required: true
- type: input
  id: "contact"
  attributes:
    label: "联系方式"
    description: "请输入一个联系方式"
    placeholder: "Email / Telegram / WeChat"
  validations:
    required: false
- type: textarea
  id: "yml-6"
  attributes:
    label: "详细描述"
    placeholder: "输入详细问题."
  validations:
    required: false
- type: textarea
  id: attachments
  attributes:
    label: 附件上传 / Attachments
    description: 请在此处拖拽或粘贴相关文件，例如截图、日志等。
    placeholder: 将文件拖拽到这里，或直接粘贴文件。
  validations:
    required: false
